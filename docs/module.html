<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="View detailed documentation for TheSecretJuice PowerShell enhancement modules. Commands, features, and usage examples.">
  <meta name="keywords" content="PowerShell module documentation, CLI tool documentation, command reference, usage examples">
  <meta name="author" content="mini-page">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mini-page.github.io/TheSecretJuice/module.html">
  <meta property="og:title" content="Module Documentation - TheSecretJuice">
  <meta property="og:description" content="Detailed module documentation with commands, features, and examples.">
  
  <title>Module - TheSecretJuice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/scrollbar.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💉</text></svg>">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        <span class="navbar-icon">💉</span>
        <span class="gradient-text">TheSecretJuice</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="modules.html">Modules</a></li>
        <li><a href="installation.html">Installation</a></li>
        <li><a href="contribute.html">Contribute</a></li>
        <li><a href="https://github.com/mini-page/TheSecretJuice" target="_blank">
          <i class="fab fa-github"></i> GitHub
        </a></li>
      </ul>
    </div>
  </nav>

  <div id="moduleContent" style="max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;">
    <!-- Content loaded dynamically -->
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-links">
        <a href="https://github.com/mini-page/TheSecretJuice" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        <a href="https://github.com/mini-page/TheSecretJuice/issues" target="_blank"><i class="fas fa-bug"></i> Report Issue</a>
      </div>
      <p class="footer-copyright">© 2025 TheSecretJuice. MIT License.</p>
    </div>
  </footer>

  <script src="assets/js/security.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const moduleName = params.get('name');
      
      if (!moduleName) {
        window.location.href = 'modules.html';
        return;
      }

      const modules = await loadModules();
      const module = modules.find(m => m.name === moduleName);
      
      if (!module) {
        document.getElementById('moduleContent').innerHTML = `
          <div style="text-align: center; padding: 4rem;">
            <i class="fas fa-exclamation-circle" style="font-size: 4rem; color: var(--error); margin-bottom: 1rem;"></i>
            <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 1rem;">Module Not Found</h1>
            <p style="color: var(--text-dim); margin-bottom: 2rem;">The requested module could not be found.</p>
            <a href="modules.html" class="btn btn-primary">
              <i class="fas fa-arrow-left"></i> Back to Modules
            </a>
          </div>
        `;
        return;
      }

      // Load markdown documentation if it exists
      const docPath = `${moduleName}.md`;
      let docContent = '';
      
      try {
        const response = await fetch(docPath);
        if (response.ok) {
          docContent = await response.text();
        }
      } catch (error) {
        console.log('No markdown doc found, using module data');
      }

      displayModuleDetails(module, docContent);
    });

    function displayModuleDetails(module, docContent) {
      const container = document.getElementById('moduleContent');
      
      let html = `
        <div style="margin-bottom: 2rem;">
          <a href="modules.html" style="color: var(--text-dim); display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
            <i class="fas fa-arrow-left"></i> Back to Modules
          </a>
        </div>

        <div style="display: flex; align-items: start; gap: 2rem; margin-bottom: 2rem;">
          <div style="font-size: 4rem;">
            <i class="fas ${module.icon}" style="background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
          </div>
          <div style="flex: 1;">
            <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0.5rem;">
              <span class="gradient-text">${module.name}</span>
            </h1>
            <p style="font-size: 1.125rem; color: var(--text-dim);">${module.description}</p>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 3rem;">
          <span class="badge badge-primary">${module.category}</span>
          <span class="badge badge-secondary">${module.commands.length} commands</span>
          <span class="badge badge-outline" style="color: var(--text-dim);">
            <i class="fas fa-code"></i> ${module.path}
          </span>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem;">
            <i class="fas fa-terminal" style="color: var(--secondary);"></i> Commands
          </h2>
          <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
            ${module.commands.map(cmd => `
              <code class="code-inline" style="padding: 0.5rem 1rem;">${cmd}</code>
            `).join('')}
          </div>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem;">
            <i class="fas fa-star" style="color: var(--warning);"></i> Features
          </h2>
          <ul style="color: var(--text-dim); margin-left: 1.5rem; list-style: disc; line-height: 2;">
            ${module.features.map(feature => `<li>${feature}</li>`).join('')}
          </ul>
        </div>

        <div class="card">
          <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem;">
            <i class="fas fa-book" style="color: var(--accent);"></i> Documentation
          </h2>
          <p style="color: var(--text-dim); margin-bottom: 1rem;">
            For detailed documentation, examples, and troubleshooting, see:
          </p>
          <a href="${docPath}" target="_blank" class="btn btn-primary">
            <i class="fas fa-file-alt"></i> View Full Documentation
          </a>
        </div>
      `;

      container.innerHTML = html;
    }
  </script>
</body>
</html>
